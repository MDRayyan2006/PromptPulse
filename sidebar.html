<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Highlighter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="sidebar.css" />
</head>

<body>

  <!-- ══════════════════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════════════════════ -->
  <header class="sb-header">
    <div class="sb-logo">
      <svg viewBox="0 0 24 24" fill="none" class="sb-logo-icon">
        <rect x="3" y="3" width="18" height="18" rx="5" fill="url(#grad)" />
        <path d="M7 9h10M7 12h7M7 15h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
        <defs>
          <linearGradient id="grad" x1="3" y1="3" x2="21" y2="21">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#8b5cf6" />
          </linearGradient>
        </defs>
      </svg>
      <span class="sb-logo-text">AI Highlighter</span>
    </div>

    <div class="sb-header-actions">
      <button class="sb-icon-btn sb-icon-btn-danger" id="btnClearAllHighlights" title="Clear all highlights">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M7 2.75A1.75 1.75 0 0 0 5.25 4.5v.25H3.5a.75.75 0 0 0 0 1.5h.538l.853 9.384A2.75 2.75 0 0 0 7.63 18h4.74a2.75 2.75 0 0 0 2.739-2.366l.853-9.384h.538a.75.75 0 0 0 0-1.5h-1.75V4.5A1.75 1.75 0 0 0 13 2.75H7Zm6.25 2V4.5a.25.25 0 0 0-.25-.25H7a.25.25 0 0 0-.25.25v.25h6.5ZM8 8a.75.75 0 0 1 .75.75v5a.75.75 0 0 1-1.5 0v-5A.75.75 0 0 1 8 8Zm4 .75a.75.75 0 0 0-1.5 0v5a.75.75 0 0 0 1.5 0v-5Z"
            clip-rule="evenodd" />
        </svg>
      </button>
      <button class="sb-icon-btn" id="btnExportJson" title="Export JSON">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M10.75 2.75a.75.75 0 00-1.5 0v8.614L6.295 8.235a.75.75 0 10-1.09 1.03l4.25 4.5a.75.75 0 001.09 0l4.25-4.5a.75.75 0 00-1.09-1.03l-2.955 3.129V2.75z" />
          <path
            d="M3.5 12.75a.75.75 0 00-1.5 0v2.5A2.75 2.75 0 004.75 18h10.5A2.75 2.75 0 0018 15.25v-2.5a.75.75 0 00-1.5 0v2.5c0 .69-.56 1.25-1.25 1.25H4.75c-.69 0-1.25-.56-1.25-1.25v-2.5z" />
        </svg>
      </button>
      <button class="sb-icon-btn" id="btnExportMd" title="Export Markdown">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd"
            d="M4.5 2A1.5 1.5 0 003 3.5v13A1.5 1.5 0 004.5 18h11a1.5 1.5 0 001.5-1.5V7.621a1.5 1.5 0 00-.44-1.06l-4.12-4.122A1.5 1.5 0 0011.378 2H4.5zm3.75 9.75a.75.75 0 01.75-.75h3a.75.75 0 010 1.5h-3a.75.75 0 01-.75-.75zM8.25 9a.75.75 0 000 1.5h5a.75.75 0 000-1.5h-5z"
            clip-rule="evenodd" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════
       TAB NAV
  ══════════════════════════════════════════════════════════ -->
  <nav class="sb-tabs" role="tablist">
    <button class="sb-tab active" data-tab="highlights" role="tab">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path
          d="M9.653 16.915l-.005-.003-.019-.01a20.759 20.759 0 01-1.162-.682 22.045 22.045 0 01-2.582-2.184C4.644 12.766 3 10.907 3 8.5a5.5 5.5 0 0111 0c0 2.407-1.644 4.266-2.885 5.536a22.049 22.049 0 01-2.582 2.184 20.8 20.8 0 01-1.162.682l-.019.01-.005.003h-.002a.739.739 0 01-.686 0l-.002-.001z" />
      </svg>
      Highlights
      <span class="sb-tab-badge" id="hlCount">0</span>
    </button>
  </nav>

  <!-- ══════════════════════════════════════════════════════
       HIGHLIGHTS TAB
  ══════════════════════════════════════════════════════════ -->
  <section class="sb-panel active" id="panel-highlights">

    <!-- Category toolbar -->
    <div class="sb-category-toolbar">
      <div class="sb-filter-bar" id="hlFilters"></div>
      <button class="sb-add-category-btn" id="btnAddCategory" title="Add custom highlight category">+ Add</button>
    </div>

    <!-- Add category panel -->
    <div class="sb-add-panel hidden" id="addCategoryPanel">
      <div class="sb-add-row">
        <input type="text" id="newCategoryName" class="sb-add-input" placeholder="Category name" maxlength="24" />
        <input type="color" id="newCategoryColor" class="sb-add-color" value="#10b981" title="Category color" aria-label="Category color" />
      </div>
      <div class="sb-add-actions">
        <button class="sb-add-save" id="btnSaveCategory">Save</button>
        <button class="sb-add-cancel" id="btnCancelCategory">Cancel</button>
      </div>
    </div>

    <!-- Search -->
    <div class="sb-search-wrap">
      <svg class="sb-search-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z"
          clip-rule="evenodd" />
      </svg>
      <input type="text" id="hlSearch" class="sb-search" placeholder="Search highlights…" />
    </div>

    <!-- List -->
    <ul class="sb-list" id="hlList" role="list">
      <li class="sb-empty" id="hlEmpty">
        <div class="sb-empty-icon">📌</div>
        <p>No highlights yet.</p>
        <p class="sb-empty-sub">Select text on any AI chat page to get started.</p>
      </li>
    </ul>

  </section>

  <script src="sidebar.js"></script>
</body>

</html>
